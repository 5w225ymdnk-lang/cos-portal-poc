<!DOCTYPE html>
<html>

<head>
    <title>Create CoS Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>Create CoS Application</h1>

    <div id="error"></div>

    <form id="appForm">

        <input
            id="bandName"
            placeholder="Band Name"
            required
            maxlength="100">

        <br><br>

        <input
            id="contactName"
            placeholder="Contact Name"
            required
            maxlength="100">

        <br><br>

        <input
            id="contactEmail"
            type="email"
            placeholder="Contact Email"
            required>

        <br><br>

        <input
            id="memberCount"
            type="number"
            placeholder="Total People"
            required
            min="1"
            max="500">

        <br><br>

        <textarea
            id="venueList"
            placeholder="Venue List"
            rows="5"
            required></textarea>

        <br><br>

        <button>Create Application</button>

    </form>

    <script>

        document
            .getElementById("appForm")
            .addEventListener(
                "submit",
                async e => {

                    e.preventDefault();

                    const bandName =
                        document
                            .getElementById("bandName")
                            .value
                            .trim();

                    const contactName =
                        document
                            .getElementById("contactName")
                            .value
                            .trim();

                    const contactEmail =
                        document
                            .getElementById("contactEmail")
                            .value
                            .trim();

                    const memberCount =
                        parseInt(
                            document
                                .getElementById("memberCount")
                                .value
                        );

                    const venueList =
                        document
                            .getElementById("venueList")
                            .value
                            .trim();

                    const errorElement =
                        document
                            .getElementById("error");

                    errorElement.innerText = "";

                    if (!bandName) {
                        errorElement.innerText =
                            "Band name is required";
                        return;
                    }

                    if (!contactName) {
                        errorElement.innerText =
                            "Contact name is required";
                        return;
                    }

                    const emailRegex =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (
                        !emailRegex.test(
                            contactEmail
                        )
                    ) {
                        errorElement.innerText =
                            "Please enter a valid email address";
                        return;
                    }

                    if (
                        isNaN(memberCount) ||
                        memberCount < 1
                    ) {
                        errorElement.innerText =
                            "Member count must be at least 1";
                        return;
                    }

                    if (!venueList) {
                        errorElement.innerText =
                            "Venue list is required";
                        return;
                    }

                    try {

                        const response =
                            await fetch(
                                "/api/application",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({
                                        bandName,
                                        contactName,
                                        contactEmail,
                                        memberCount,
                                        venueList
                                    })
                                }
                            );

                        const data =
                            await response.json();

                        window.location =
                            "/application.html?id=" +
                            data.applicationId;

                    } catch (error) {

                        errorElement.innerText =
                            "Unable to create application.";

                    }

                }
            );

    </script>

</body>

</html>

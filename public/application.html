<!DOCTYPE html>
<html>

<head>
    <title>Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        #error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <a id="backLink">
        ← Back To Application Dashboard
    </a>

    <br><br>

    <h1 id="title"></h1>

    <div id="error"></div>

    <form
        id="memberForm"
        enctype="multipart/form-data">

        <h2>Add Member</h2>

        <input
            name="fullName"
            placeholder="Full Name"
            required>

        <br><br>

        <input
            name="nationality"
            placeholder="Nationality"
            required>

        <br><br>

        <input
            name="placeOfBirth"
            placeholder="Place Of Birth">

        <br><br>

        <input
            name="countryOfBirth"
            placeholder="Country Of Birth">

        <br><br>

        <textarea
            name="homeAddress"
            placeholder="Home Address"></textarea>

        <br><br>

        <label>First Entry Date</label>
        <br>
        <input
            type="date"
            name="firstEntryDate">

        <br><br>

        <label>Final Exit Date</label>
        <br>
        <input
            type="date"
            name="finalExitDate">

        <br><br>

        <input
            type="number"
            name="showCount"
            placeholder="Number Of Shows">

        <br><br>

        <input
            name="earnings"
            placeholder="Earnings">

        <br><br>

        <input
            name="jobTitle"
            placeholder="Job Title">

        <br><br>

        <select name="travellingFromIreland">
            <option>No</option>
            <option>Yes</option>
        </select>

        <br><br>

        <select name="reEnteringUk">
            <option>No</option>
            <option>Yes</option>
        </select>

        <br><br>

        <label>First Exit Date</label>
        <br>
        <input
            type="date"
            name="firstExitDate">

        <br><br>

        <label>Re-entry Date</label>
        <br>
        <input
            type="date"
            name="reEntryDate">

        <br><br>

        <input
            name="passportNumber"
            placeholder="Passport Number">

        <br><br>

        <label>Passport Expiry</label>
        <br>
        <input
            type="date"
            name="passportExpiry">

        <br><br>

        <label>Passport Upload</label>
        <br>
        <input
            type="file"
            name="passport"
            required>

        <br><br>

        <button type="submit">
            Save Member
        </button>

    </form>

    <script>

        const token =
            new URLSearchParams(
                window.location.search
            ).get("token");

        let appInfo;
        let appId;

        async function init() {

            if (!token) {

                document.body.innerHTML =
                    "<h1>Invalid application link</h1>";

                return;
            }

            const response =
                await fetch(
                    "/api/application/token/" +
                    token
                );

            if (!response.ok) {

                document.body.innerHTML =
                    "<h1>Invalid application link</h1>";

                return;
            }

            appInfo =
                await response.json();

            if (!appInfo) {

                document.body.innerHTML =
                    "<h1>Invalid application link</h1>";

                return;
            }

        appId =
            appInfo.applicationId;

        document
            .getElementById("backLink")
            .href =
            "/applicant.html?token=" +
            token;

        document
            .getElementById("title")
            .innerText =
            appInfo.bandName;

        }

        async function deleteMember(id) {

            const confirmed =
                confirm(
                    "Delete member?"
                );

            if (!confirmed) {
                return;
            }

            await fetch(
                "/api/member/" + id,
                {
                    method: "DELETE"
                }
            );


        }

        document
            .getElementById("memberForm")
            .addEventListener(
                "submit",
                async e => {

                    e.preventDefault();

                    document
                        .getElementById("error")
                        .innerText = "";

                    const form =
                        new FormData(
                            e.target
                        );

                    const fullName =
                        form.get("fullName")
                            ?.trim();

                    const nationality =
                        form.get("nationality")
                            ?.trim();

                    const passportNumber =
                        form.get("passportNumber")
                            ?.trim();

                    const passportExpiry =
                        form.get(
                            "passportExpiry"
                        );

                    const firstEntryDate =
                        form.get(
                            "firstEntryDate"
                        );

                    const finalExitDate =
                        form.get(
                            "finalExitDate"
                        );

                    const reEnteringUk =
                        form.get(
                            "reEnteringUk"
                        );

                    const firstExitDate =
                        form.get(
                            "firstExitDate"
                        );

                    const reEntryDate =
                        form.get(
                            "reEntryDate"
                        );

                    const errorElement =
                        document
                            .getElementById(
                                "error"
                            );

                    if (!fullName) {
                        errorElement.innerText =
                            "Full name is required";
                        return;
                    }

                    if (fullName.length < 2) {
                        errorElement.innerText =
                            "Full name is too short";
                        return;
                    }

                    if (!nationality) {
                        errorElement.innerText =
                            "Nationality is required";
                        return;
                    }

                    if (!passportNumber) {
                        errorElement.innerText =
                            "Passport number is required";
                        return;
                    }

                    if (passportNumber.length < 6) {
                        errorElement.innerText =
                            "Passport number must be at least 6 characters";
                        return;
                    }

                    if (!passportExpiry) {
                        errorElement.innerText =
                            "Passport expiry is required";
                        return;
                    }

                    const today =
                        new Date();

                    const passportDate =
                        new Date(
                            passportExpiry
                        );

                    if (
                        passportDate <= today
                    ) {
                        errorElement.innerText =
                            "Passport has expired";
                        return;
                    }

                    if (
                        firstEntryDate &&
                        finalExitDate &&
                        new Date(
                            finalExitDate
                        ) <
                        new Date(
                            firstEntryDate
                        )
                    ) {
                        errorElement.innerText =
                            "Final exit date must be after first entry date";
                        return;
                    }

                    if (
                        reEnteringUk ===
                        "Yes"
                    ) {

                        if (
                            !firstExitDate ||
                            !reEntryDate
                        ) {

                            errorElement.innerText =
                                "First exit and re-entry dates are required";

                            return;
                        }

                        if (
                            new Date(
                                reEntryDate
                            ) <
                            new Date(
                                firstExitDate
                            )
                        ) {

                            errorElement.innerText =
                                "Re-entry date must be after first exit date";

                            return;
                        }

                    }

                    form.append(
                        "applicationId",
                        appId
                    );

                    const response =
                        await fetch(
                            "/api/member",
                            {
                                method: "POST",
                                body: form
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        !response.ok
                    ) {

                        errorElement.innerText =
                            data.error ||
                            "Unable to save member";

                        return;

                    }

                    e.target.reset();

                    window.location =
                        "/applicant.html?token=" +
                        token;

                }
            );
        
        init();

    </script>

</body>

</html>

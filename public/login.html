<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: auto;
            padding: 50px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <h1>Admin Login</h1>

    <div id="error"></div>

    <form id="loginForm">

        <input
            id="username"
            placeholder="Username">

        <br><br>

        <input
            id="password"
            type="password"
            placeholder="Password">

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async e => {

                    e.preventDefault();

                    document
                        .getElementById("error")
                        .innerText = "";

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify({
                                    username:
                                        document.getElementById("username").value,
                                    password:
                                        document.getElementById("password").value
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {

                        document
                            .getElementById("error")
                            .innerText =
                            data.error;

                        return;

                    }

                    window.location =
                        "/dashboard.html";

                }
            );

    </script>

</body>

</html>

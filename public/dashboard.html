<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body>

    <h1>Applications Dashboard</h1>

    <div id="apps"></div>

    <script>

        async function load() {

            const response =
                await fetch("/api/dashboard");

            const apps =
                await response.json();

            let html = "";

            apps.forEach(app => {

                const colour =
                    app.progress >= 100
                        ? "#0b8f00"
                        : "#d77d00";

                html += `
                <a
                    href="/application.html?id=${app.applicationId}"
                    style="
                        text-decoration:none;
                        display:block;
                    "
                >
                    <div
                        style="
                            background:${colour};
                            color:white;
                            padding:15px;
                            margin-bottom:10px;
                            border-radius:5px;
                            cursor:pointer;
                        "
                    >

                        <b>${app.bandName}</b>

                        <br><br>

                        ${app.applicationId}

                        <br><br>

                        Members:
                        ${app.addedMembers}
                        of
                        ${app.memberCount}

                        <br><br>

                        Progress:
                        ${app.progress}%

                    </div>
                </a>
                `;

            });

            document
                .getElementById("apps")
                .innerHTML = html;

        }

        load();

    </script>

</body>

</html>

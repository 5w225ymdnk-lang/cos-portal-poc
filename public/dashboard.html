<!DOCTYPE html>
<html>

<head>

    <title>Applications Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
        }

        .progress {
            height: 25px;
            background: #ddd;
        }

        .bar {
            height: 25px;
            background: green;
        }

        .draft {
            color: orange;
            font-weight: bold;
        }

        .complete {
            color: green;
            font-weight: bold;
        }

        button {
            padding: 10px;
            cursor: pointer;
            margin-right: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .top-actions {
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <h1>Applications Dashboard</h1>

    <div class="top-actions">

        <button id="createApplicationButton">
            Create New Application
        </button>

        <button id="logoutButton">
            Logout
        </button>

    </div>

    <input
        id="search"
        placeholder="Search by band, contact or email">

    <br><br>

    <div id="applications">
        Loading...
    </div>

    <script>

        let allApplications = [];

        async function checkAuth() {

            const response =
                await fetch("/api/auth/me");

            const auth =
                await response.json();

            if (!auth.authenticated) {

                window.location =
                    "/login.html";

                return false;
            }

            return true;
        }

        async function load() {

            const authorised =
                await checkAuth();

            if (!authorised) {
                return;
            }

            const response =
                await fetch("/api/dashboard");

            if (response.status === 401) {

                window.location =
                    "/login.html";

                return;
            }

            allApplications =
                await response.json();

            renderApplications(
                allApplications
            );
        }

        function renderApplications(
            applications
        ) {

            if (!applications.length) {

                document
                    .getElementById("applications")
                    .innerHTML =
                    `
                    <div class="card">
                        No applications found.
                    </div>
                    `;

                return;
            }

            let html = "";

            applications.forEach(app => {

                const status =
                    app.draft
                        ? '<span class="draft">Draft</span>'
                        : '<span class="complete">Active</span>';

                html += `

                <div class="card">

                    <h3>
                        ${app.bandName}
                    </h3>

                    <p>
                        ${status}
                    </p>

                    <p>
                        Contact:
                        ${app.contactName}
                    </p>

                    <p>
                        Email:
                        ${app.contactEmail}
                    </p>

                    <p>
                        Members:
                        ${app.addedMembers}
                        /
                        ${app.memberCount}
                    </p>

                    <div class="progress">

                        <div
                            class="bar"
                            style="width:${app.progress}%;">
                        </div>

                    </div>

                    <br>

                    <strong>
                        Magic Link
                    </strong>

                    <br><br>

                    <input
                        readonly
                        value="http://localhost:3000/application.html?token=${app.accessToken}">

                    <br><br>

                    <button
                        onclick="copyLink('${app.accessToken}')">
                        Copy Link
                    </button>

                    <button
                        onclick="window.location='/application.html?token=${app.accessToken}'">
                        Open Application
                    </button>

                    <button
                        onclick="deleteApplication('${app.applicationId}')">
                        Delete Application
                    </button>

                </div>

                `;
            });

            document
                .getElementById("applications")
                .innerHTML =
                html;
        }

        async function deleteApplication(
            applicationId
        ) {

            const confirmed =
                confirm(
                    "Delete this application?"
                );

            if (!confirmed) {
                return;
            }

            await fetch(
                "/api/application/" +
                applicationId,
                {
                    method: "DELETE"
                }
            );

            load();
        }

        function copyLink(token) {

            const link =
                `http://localhost:3000/application.html?token=${token}`;

            navigator.clipboard.writeText(
                link
            );

            alert(
                "Magic link copied"
            );
        }

        document
            .getElementById("search")
            .addEventListener(
                "input",
                e => {

                    const term =
                        e.target.value
                            .toLowerCase();

                    const filtered =
                        allApplications.filter(
                            app =>

                                app.bandName
                                    .toLowerCase()
                                    .includes(term)

                                ||

                                app.contactName
                                    .toLowerCase()
                                    .includes(term)

                                ||

                                app.contactEmail
                                    .toLowerCase()
                                    .includes(term)
                        );

                    renderApplications(
                        filtered
                    );
                }
            );

        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                async () => {

                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );

                    window.location =
                        "/login.html";
                }
            );

        document
            .getElementById(
                "createApplicationButton"
            )
            .addEventListener(
                "click",
                () => {

                    window.location =
                        "/create-application.html";
                }
            );

        load();

    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
        }

        .progress {
            height: 25px;
            background: #ddd;
        }

        .bar {
            height: 25px;
            background: green;
        }

        .draft {
            color: orange;
            font-weight: bold;
        }

        .complete {
            color: green;
            font-weight: bold;
        }

        button {
            padding: 10px;
        }

    </style>

</head>

<body>

    <h1>Applications Dashboard</h1>

    <button id="logoutButton">
        Logout
    </button>

    <br><br>

    <div id="applications">
        Loading...
    </div>

    <script>

        async function checkAuth() {

            const response =
                await fetch(
                    "/api/auth/me"
                );

            const auth =
                await response.json();

            if (!auth.authenticated) {

                window.location =
                    "/login.html";

                return false;

            }

            return true;

        }

        async function load() {

            const authorised =
                await checkAuth();

            if (!authorised) {
                return;
            }

            const response =
                await fetch(
                    "/api/dashboard"
                );

            if (response.status === 401) {

                window.location =
                    "/login.html";

                return;

            }

            const applications =
                await response.json();

            let html = "";

            applications.forEach(app => {

                const status =
                    app.draft
                        ? '<span class="draft">Draft</span>'
                        : '<span class="complete">Active</span>';

                html += `
                <div class="card">

                    <h3>
                        ${app.bandName}
                    </h3>

                    <p>
                        ${status}
                    </p>

                    <p>
                        Contact:
                        ${app.contactName}
                    </p>

                    <p>
                        Email:
                        ${app.contactEmail}
                    </p>

                    <p>
                        Members:
                        ${app.addedMembers}
                        /
                        ${app.memberCount}
                    </p>

                    <div class="progress">
                        <div
                            class="bar"
                            style="
                            width:${app.progress}%;
                            ">
                        </div>
                    </div>

                    <br>

                    <a
                        href="/application.html?token=${app.accessToken}">
                        Open Application
                    </a>

                </div>
                `;

            });

            document
                .getElementById("applications")
                .innerHTML =
                html;

        }

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                async () => {

                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );

                    window.location =
                        "/login.html";

                }
            );

        load();

    </script>

</body>

</html>

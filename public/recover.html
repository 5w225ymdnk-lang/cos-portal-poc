<!DOCTYPE html>
<html>

<head>
    <title>Recover Application</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            max-width:600px;
            margin:auto;
            padding:20px;
        }

        input,
        button{
            width:100%;
            padding:10px;
            box-sizing:border-box;
        }

        #message{
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h1>Recover Application</h1>

<p>
Enter the email address used when creating your application.
</p>

<input
    id="email"
    type="email"
    placeholder="Email Address">

<br><br>

<button id="recover">
    Send Recovery Link
</button>

<div id="message"></div>

</body>

</html>
